name: Publicar site acadêmico no GitHub Pages

on:
  # Sem publicação automática. Executar apenas após autorização da responsável.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter site
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente os arquivos públicos
        run: |
          mkdir -p _site
          cp index.html styles.css script.js .nojekyll _site/
          cp -R assets dados _site/
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
